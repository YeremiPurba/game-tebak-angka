<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Tebak Angka</title>
</head>
<body>

    <!-- sebelum game dimulai -->
    {% if not game_started %}
        <h1>=== GAME TEBAK ANGKA ===</h1><br>

        <p>Siap untuk bermain?</p>

        <!-- tombol mulai bermain -->
        <form action="/new-game" method="POST">
            <button type="submit">Mulai Bermain</button>
        </form>

    <!-- setelah game berakhir -->
    {% elif game_over %}
        <h2>RONDE BERAKHIR</h2>
        <p>{{ message }}</p>

        <!-- tombol main lagi -->
        <form action="/new-game" method="POST">
            <button type="submit">Main Lagi</button>
        </form>
    
    <!-- saat game berlangsung -->
    {% else %}
        <h1>=== GAME TEBAK ANGKA ===</h1><br>

        <p>Kesempatan tersisa --- {{ attempts }}</p>
        <!-- formulir untuk menebak angka -->
        <form action="/guess" method="POST">
            <label for="guess-number">Masukkan Tebakanmu: </label>
            <input type="number" id="guess-number" name="guess_number" required>

            <button type="submit">Tebak</button>
        </form>
        <p>Pesan hasil tebakan --- {{ message }}</p>
    {% endif %}

</body>
</html>
